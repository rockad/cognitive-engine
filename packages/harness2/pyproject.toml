[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-harness2"
version = "0.1.0"
description = "System 2 for Cognitive Engine: a failure-driven Propose-Probe-Compose prompt optimizer behind a strict loopback MCP server"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["fastmcp>=4.1,<5", "httpx>=0.28"]

[project.optional-dependencies]
# Upstream google-research/harness2 as a PINNED git dependency (RFC 004 §2.1, §2.8). It has
# no mandatory dependencies of its own (its heavy extras `render` and `bridge` are NOT
# requested here), but it declares `requires-python <3.14` and needs a GitHub fetch, so it
# stays opt-in until the engine actually imports it. Bump the rev deliberately to adopt a
# new upstream version.
upstream = ["harness2"]

[tool.uv.sources]
harness2 = { git = "https://github.com/google-research/harness2.git", rev = "1cfe254e8d25b15f37048c3730134686abe60335" }

[project.scripts]
cognitive-harness2 = "cognitive_harness2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_harness2"]
